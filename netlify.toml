# 旧・全世界対応版（英語版 / DPA）は日本国内先行の方針により提供を停止し、
# 対応する日本語の現行文書へ転送する。ファイルは _archive/ に保管。
[[redirects]]
  from = "/dpa"
  to = "/legal/security"
  status = 301
  force = true

[[redirects]]
  from = "/dpa.html"
  to = "/legal/security"
  status = 301
  force = true

[[redirects]]
  from = "/terms-en"
  to = "/legal/terms"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-en"
  to = "/legal/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/dpa-en"
  to = "/legal/security"
  status = 301
  force = true

# ---- www → apex ----
[[redirects]]
  from = "https://www.athlomedonline.com/*"
  to = "https://athlomedonline.com/:splat"
  status = 301
  force = true

# ---- セキュリティヘッダー ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; form-action https://formspree.io; frame-ancestors 'self'; base-uri 'self'"

# ---- キャッシュ ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# アーカイブは配信しない
[[headers]]
  for = "/_archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
