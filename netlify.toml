[[redirects]]
  from = "/terms"
  to = "/legal/terms"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/legal/terms"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/legal/privacy"
