# ---- .html 付きURLはクリーンURLへ301（重複コンテンツ回避）----
[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/checkout/confirm.html"
  to = "/checkout/confirm"
  status = 301
  force = true

[[redirects]]
  from = "/legal/:doc.html"
  to = "/legal/:doc"
  status = 301
  force = true

[[redirects]]
  from = "/legal/consent/:doc.html"
  to = "/legal/consent/:doc"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

